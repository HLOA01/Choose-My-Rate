name: CI

on:
  pull_request:
    branches: [main, fix/application-continuation-2026-10-30, feature/hloa-quote-contract-2026-10-30, test/offline-ecosystem-rehearsal-2026-10-30, feature/sally-text-provider-2026-10-30, feature/guest-input-continuation-2026-10-30, feature/refinance-pi-comparison-2026-10-30, test/cross-origin-application-2026-10-31, feature/hosted-application-link-2026-10-31, test/built-application-preview-2026-10-31]
  push:
    branches: [main, fix/restore-sally-behavior-2026-09-01]

# No secrets, credentials, or private-repo access are used anywhere in this
# workflow. All QA below is self-contained (offline unit checks + Playwright
# tests that mock every backend call, including the HLOA Lead Engine, via
# page.route interception) — none of it talks to a real hloa-platform
# service, a database, or any external endpoint.
jobs:
  quality:
    name: Lint, build, and QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: QA — scenarios
        run: npm run qa:scenarios

      - name: QA — borrower quote contracts (synthetic fixtures)
        run: npm run qa:quote-contract

      - name: QA — Sally
        run: npm run qa:sally

      - name: QA — Sally reply guardrail
        run: npm run qa:sally-guardrail

      - name: QA - Sally text provider boundary (no external network)
        run: npm run qa:sally-provider

      - name: QA — HLOA platform integration (offline unit checks)
        run: npm run qa:platform

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: QA — browser (Playwright, all backends mocked)
        run: npm run qa:browser
        timeout-minutes: 10

      - name: QA — configured application redirect (local receiver, no acceptance)
        run: npm run qa:application
        timeout-minutes: 5

      - name: QA - cross-origin application navigation (synthetic receiver only)
        run: npm run qa:cross-origin-application
        timeout-minutes: 5

      - name: QA - configured routing query is preserved (synthetic receiver only)
        run: npm run qa:cross-origin-application-query
        timeout-minutes: 5

      - name: QA - exact built artifact preview (synthetic targets only)
        run: CMR_EXPECTED_SHA=$(git rev-parse HEAD) npm run qa:built-preview
        timeout-minutes: 8

      - name: Upload TEST built-preview manifest and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-preview-readiness
          path: test-results/built-preview/
